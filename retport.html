<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Accident — Accident Cloud System</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #534AB7;
      --primary-light: #7F77DD;
      --bg:            #EEEDFE;
      --surface:       #ffffff;
      --text:          #1a1a2e;
      --muted:         #888;
      --danger:        #e24b4a;
      --success:       #057a55;
      --shadow:        0 8px 32px rgba(83,74,183,0.10);
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 0 #e0dff5;
      position: relative;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 36px; height: 36px;
      background: var(--bg);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    header h1 { font-size: 15px; font-weight: 600; color: var(--text); }
    header h1 span { color: var(--primary-light); font-weight: 300; }
    .header-nav { display: flex; gap: 6px; align-items: center; }
    .nav-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      font-family: 'Sora', sans-serif;
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .nav-btn.outline {
      background: transparent;
      color: var(--muted);
      border: 1px solid #e0dff5;
    }
    .nav-btn.outline:hover { background: var(--bg); color: var(--primary); }
    .nav-btn.primary { background: var(--primary); color: #fff; }
    .nav-btn.primary:hover { background: #3C3489; }
    .nav-btn.danger-btn {
      background: transparent;
      color: #e24b4a;
      border: 1px solid #fde8e8;
      font-size: 11px;
    }
    .nav-btn.danger-btn:hover { background: #fde8e8; }

    /* ── Main layout ── */
    main {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 24px;
    }

    .form-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 560px;
      overflow: hidden;
      position: relative;
    }

    .form-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #7F77DD, #534AB7, #7F77DD);
      background-size: 200%;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    .form-header {
      padding: 28px 32px 0;
    }
    .form-header h2 {
      font-size: 18px; font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }
    .form-header p {
      font-size: 12px; color: var(--muted); font-weight: 300;
    }

    form { padding: 24px 32px 32px; }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 11px; font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .input-wrap { position: relative; }
    .input-wrap svg.icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      width: 15px; height: 15px;
      color: #aaa;
      pointer-events: none;
    }

    input[type="text"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px 10px 38px;
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      background: #f7f7fb;
      border: 1px solid #e0dff5;
      border-radius: 8px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea { padding: 10px 12px; resize: vertical; min-height: 90px; }
    select   { appearance: none; cursor: pointer; }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(127,119,221,0.12);
      background: #fff;
    }

    /* Coords row */
    .coords-row {
      display: flex;
      gap: 10px;
    }
    .coords-row .field { flex: 1; margin-bottom: 0; }
    .coords-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f0effe;
      border: 1px solid #d0cef5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--primary);
      margin-bottom: 18px;
    }
    .coords-banner.hidden { display: none; }

    /* Image upload */
    .upload-area {
      border: 2px dashed #e0dff5;
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-area:hover { border-color: var(--primary-light); background: #f7f7fb; }
    .upload-area.has-file { border-color: var(--primary); background: #f0effe; }
    .upload-area input { display: none; }
    .upload-icon { margin-bottom: 8px; color: #aaa; }
    .upload-area.has-file .upload-icon { color: var(--primary); }
    .upload-label { font-size: 12px; color: var(--muted); }
    .upload-area.has-file .upload-label { color: var(--primary); font-weight: 500; }

    /* Success / error banners */
    .banner {
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .banner.visible { display: flex; }
    .banner.success { background: #def7ec; color: var(--success); }
    .banner.error   { background: #fde8e8; color: var(--danger); }

    /* Submit */
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Sora', sans-serif;
      font-size: 14px; font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .submit-btn:hover:not(:disabled) { background: #3C3489; }
    .submit-btn:active:not(:disabled) { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .progress-bar {
      height: 3px;
      background: #e0dff5;
      border-radius: 2px;
      margin-bottom: 16px;
      overflow: hidden;
      display: none;
    }
    .progress-bar.visible { display: block; }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .spinner-sm {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Auth guard overlay */
    #authGuard {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    #authGuard.hidden { display: none; }
  </style>
</head>
<body>

<!-- Auth loading overlay -->
<div id="authGuard">
  <div style="text-align:center">
    <div style="width:32px;height:32px;border:3px solid #e0dff5;border-top-color:#534AB7;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px"></div>
    <p style="font-size:13px;color:#888;">Checking session…</p>
  </div>
</div>

<!-- ── Header ── -->
<header>
  <div class="header-left">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="#534AB7" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 8v4l3 3"/>
      </svg>
    </div>
    <h1>Accident <span>Cloud System</span></h1>
  </div>
  <nav class="header-nav">
    <a href="dashboard.html" class="nav-btn outline">Dashboard</a>
    <a href="map.html"       class="nav-btn outline">Map</a>
    <a href="view_.html"     class="nav-btn outline">Reports</a>
    <button id="logoutBtn"   class="nav-btn danger-btn" onclick="handleLogout()">Sign out</button>
  </nav>
</header>

<!-- ── Form ── -->
<main>
  <div class="form-card">
    <div class="form-header">
      <h2>🚨 Report a New Accident</h2>
      <p>Fill in the details below. Fields marked * are required.</p>
    </div>

    <form id="reportForm">

      <!-- Coords banner (shown if coming from map) -->
      <div class="coords-banner hidden" id="coordsBanner">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        Location pinned from map
      </div>

      <!-- Location name -->
      <div class="field">
        <label>Location Description *</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <input type="text" id="locationInput" placeholder="e.g. King Fahd Road, near exit 7" required>
        </div>
      </div>

      <!-- Coordinates -->
      <div class="coords-row">
        <div class="field">
          <label>Latitude</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
            <input type="text" id="latInput" placeholder="24.7136" inputmode="decimal">
          </div>
        </div>
        <div class="field">
          <label>Longitude</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
            <input type="text" id="lngInput" placeholder="46.6753" inputmode="decimal">
          </div>
        </div>
      </div>

      <!-- Type -->
      <div class="field" style="margin-top:18px">
        <label>Accident Type *</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <select id="typeInput">
            <option value="">— Select type —</option>
            <option value="Vehicle Collision">Vehicle Collision</option>
            <option value="Pedestrian Accident">Pedestrian Accident</option>
            <option value="Rollover">Rollover</option>
            <option value="Hit and Run">Hit and Run</option>
            <option value="Road Hazard">Road Hazard</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <!-- Phone -->
      <div class="field">
        <label>Contact Phone *</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.88 13.32 19.79 19.79 0 0 1 1.75 4.7 2 2 0 0 1 3.73 2.5h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 10.09a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <input type="tel" id="phoneInput" placeholder="05XXXXXXXX" required>
        </div>
      </div>

      <!-- Description -->
      <div class="field">
        <label>Description *</label>
        <textarea id="descInput" placeholder="Describe what happened…" required></textarea>
      </div>

      <!-- Image -->
      <div class="field">
        <label>Photo (optional)</label>
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('imageInput').click()">
          <input type="file" id="imageInput" accept="image/*" onchange="handleFileSelect(this)">
          <div class="upload-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <div class="upload-label" id="uploadLabel">Click to attach a photo</div>
        </div>
      </div>

      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="banner success" id="successBanner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Report submitted successfully!
      </div>

      <div class="banner error" id="errorBanner"></div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span id="btnText">Submit Report</span>
        <div class="spinner-sm" id="spinner"></div>
      </button>

    </form>
  </div>
</main>

<script type="module">
import { initializeApp }        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
                                from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, addDoc, collection }
                                from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL }
                                from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
 apiKey: "AIzaSyD5i7LkVRCKg2L2PrzwNm7PeDYKytR-jOc",
 authDomain: "accident-cloud-system-41ad9.firebaseapp.com",
 projectId: "accident-cloud-system-41ad9",
 storageBucket: "accident-cloud-system-41ad9.firebasestorage.app",
 messagingSenderId: "460550861200",
 appId: "1:460550861200:web:bd0a77ac5a6b29a52c4315"
};

const app     = initializeApp(firebaseConfig);
const auth    = getAuth(app);
const db      = getFirestore(app);
const storage = getStorage(app);

// ── Auth guard ──────────────────────────────────────────────
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.replace("log_in.html");
  } else {
    document.getElementById("authGuard").classList.add("hidden");
  }
});

// ── Read lat/lng from URL params (from map.html pin mode) ───
const params = new URLSearchParams(window.location.search);
const urlLat = params.get("lat");
const urlLng = params.get("lng");

if (urlLat && urlLng) {
  document.getElementById("latInput").value = urlLat;
  document.getElementById("lngInput").value = urlLng;
  document.getElementById("coordsBanner").classList.remove("hidden");
}

// ── File select ─────────────────────────────────────────────
window.handleFileSelect = function(input) {
  const file = input.files[0];
  if (!file) return;
  const area  = document.getElementById("uploadArea");
  const label = document.getElementById("uploadLabel");
  area.classList.add("has-file");
  label.textContent = file.name;
};

// ── Logout ──────────────────────────────────────────────────
window.handleLogout = async function() {
  await signOut(auth);
  window.location.replace("log_in.html");
};

// ── Submit ──────────────────────────────────────────────────
document.getElementById("reportForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const location    = document.getElementById("locationInput").value.trim();
  const lat         = document.getElementById("latInput").value.trim();
  const lng         = document.getElementById("lngInput").value.trim();
  const type        = document.getElementById("typeInput").value;
  const phone       = document.getElementById("phoneInput").value.trim();
  const description = document.getElementById("descInput").value.trim();
  const file        = document.getElementById("imageInput").files[0];

  const btn         = document.getElementById("submitBtn");
  const spinner     = document.getElementById("spinner");
  const btnText     = document.getElementById("btnText");
  const progressBar = document.getElementById("progressBar");
  const progressFill= document.getElementById("progressFill");
  const successBanner = document.getElementById("successBanner");
  const errorBanner   = document.getElementById("errorBanner");

  successBanner.classList.remove("visible");
  errorBanner.classList.remove("visible");

  if (!location || !type || !phone || !description) {
    errorBanner.textContent = "Please fill in all required fields.";
    errorBanner.classList.add("visible");
    return;
  }

  btn.disabled = true;
  spinner.style.display = "block";
  btnText.textContent = "Submitting…";

  try {
    let imageUrl = "";

    if (file) {
      progressBar.classList.add("visible");
      const storageRef = ref(storage, "accident-images/" + Date.now() + "_" + file.name);
      await new Promise((resolve, reject) => {
        const task = uploadBytesResumable(storageRef, file);
        task.on("state_changed",
          (snap) => {
            const pct = (snap.bytesTransferred / snap.totalBytes) * 100;
            progressFill.style.width = pct + "%";
          },
          reject,
          async () => {
            imageUrl = await getDownloadURL(task.snapshot.ref);
            resolve();
          }
        );
      });
      progressBar.classList.remove("visible");
    }

    await addDoc(collection(db, "accidents"), {
      location:    location,
      lat:         lat || null,
      lng:         lng || null,
      type:        type,
      phone:       phone,
      description: description,
      image:       imageUrl,
      status:      "new",
      createdAt:   new Date(),
      time:        new Date()
    });

    successBanner.classList.add("visible");
    document.getElementById("reportForm").reset();
    document.getElementById("uploadArea").classList.remove("has-file");
    document.getElementById("uploadLabel").textContent = "Click to attach a photo";
    document.getElementById("coordsBanner").classList.add("hidden");

    setTimeout(() => window.location.replace("view_.html"), 1800);

  } catch (err) {
    console.error(err);
    errorBanner.textContent = "Failed to submit report. Please try again.";
    errorBanner.classList.add("visible");
  } finally {
    btn.disabled = false;
    spinner.style.display = "none";
    btnText.textContent = "Submit Report";
    progressFill.style.width = "0%";
  }
});
</script>

</body>
</html>
